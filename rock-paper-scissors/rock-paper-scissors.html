<!DOCTYPE html>
<html lang="en">
<head>
  <title>game</title>
  <link rel="stylesheet" href="rock-paper-scissors copy.css">
</head>
<body>
  <p class="title">Rock Paper Scissors</p>

  <button class="move-button js-rock-button">
    <img src="rock-emoji.png" class="move-icon">
  </button>

  <button class="move-button js-paper-button">
    <img src="paper-emoji.png" class="move-icon">
  </button>

  <button class="move-button js-Scissors-button">
    <img src="scissors-emoji.png" class="move-icon">
  </button>

  <p class="js-result result"></p>
  <p class="js-moves"></p>
  <p class="js-score score"></p>

  <button  class="reset-score-button js-reset-score-button">Reset Scores</button>

  <button class="auto-play-button js-auto-play-button">Auto play</button>
  
  <script src="rock-paper-scissors copy.js"></script>
</body>
</html>
