<!DOCTYPE html>
<html lang="en">
<head>
  <title>10d</title>
  <style>
    .toggle-button{
      background-color: rgb(225, 224, 222);
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
    }
    .is-toggled{
      background-color: rgb(0, 0, 0);
      color: aliceblue;
    }

  </style>
</head>
<body>
  <button class="toggle-button js-button-1" onclick=" show('.js-button-1');">
    Gaming
  </button>
  <button class="toggle-button js-button-2" onclick=" show('.js-button-2');">
    Music
  </button>
  <button class="toggle-button js-button-3" onclick=" show('.js-button-3');">
    Tech
  </button>

  <script>
    function show(jsClass){
      const btn = document.querySelector(jsClass);
      if(btn.classList.contains('is-toggled')){
        btn.classList.remove('is-toggled');
      }else{
        turnOffPreviousButton();
        btn.classList.add('is-toggled');
      } 
    }
    function turnOffPreviousButton(){
      const previousButton = document.querySelector('.is-toggled');
      if (previousButton) {
        previousButton.classList.remove('is-toggled');
      }
    }
  </script>

</body>
</html>
