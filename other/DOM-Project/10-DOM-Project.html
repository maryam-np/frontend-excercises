<!DOCTYPE html>
<html lang="en">
<head>
  <title>DOM Project</title>
  <style>
    body {
      font-family: Arial;
    }
    .subscribe-button {
      border: none;
      background-color: black;
      color: white;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 15px;
      padding-right: 15px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-bottom: 30px;
    }
    .is-subscribed {
      background-color: rgb(240, 240, 240);
      color: black;
    }
    .calculate-button {
      background-color: green;
      color: white;
      border: none;
      font-size: 15px;
      padding: 12px 15px;
      cursor: pointer;
    }
    .cost-input {
      font-size: 15px;
      padding: 10px;
    }
    .error{
      color: red;
    }
  </style>
</head>
<body>
  <p>YouTube Subscribe Button</p>
  <button class="Subscribe-button subscribe-button" onclick="
    subscribe();
  ">Subscribe</button>

  <p>Amazon Shipping Calculator</p>
  <p>Orders under $40 = +$10 shipping.</p>
  <p>Orders over $40 = FREE shipping.</p>

  <input type="text" placeholder="Cost of order" class="js-input cost-input" onkeydown=" 
    handleCostKeyDown(event);
  ">

  <button class="calculate-button" onclick=" 
    calculateElement();
  ">Calculate</button>

  <p class="js-input-result"></p>
  <p class="js-error-message error"></p>

  <script>
    
    function calculateElement(){
      const inputValue = document.querySelector('.js-input');
      let cost = Number(inputValue.value);

      if(cost < 0){
        document.querySelector('.js-error-message').innerHTML = 'Error: cost cannot be less than $0';
        return;
      }
      if (cost < 40){
        cost += 10;
      }
      document.querySelector('.js-input-result').innerHTML = `$${cost}`;
      
    }
    
    function handleCostKeyDown(event){
      if(event.key === 'Enter'){
        calculateElement();
      }
    }

    function subscribe(){
      let subscribeButton = document.querySelector('.Subscribe-button');
      if (subscribeButton.innerText === 'Subscribe') {
        subscribeButton.innerHTML = 'Subscribed';
        subscribeButton.classList.add('is-subscribed');
      } else {
        subscribeButton.innerHTML = 'Subscribe';
        subscribeButton.classList.remove('is-subscribed');
      }
    }
  </script>
</body>
</html>
